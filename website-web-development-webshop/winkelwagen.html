<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winkelwagen | Nora's Flora</title>
    <link rel="stylesheet" href="Nora's-Flora-teamnaam.css">
    <style>
        .cart-container { max-width: 1200px; margin: 20px auto; }
        .cart-item-row { 
            display: flex; 
            align-items: center; 
            border: 1px solid #ddd; 
            padding: 15px; 
            margin: 10px 0; 
            gap: 20px;
        }
        .cart-item-image { width: 80px; height: 80px; object-fit: cover; }
        .cart-item-info { flex-grow: 1; }
        .cart-item-title { font-weight: bold; margin: 5px 0; }
        .cart-item-price { color: #2c5f2d; font-weight: bold; margin: 5px 0; }
        .quantity-control { display: flex; align-items: center; gap: 10px; }
        .quantity-control input { width: 60px; padding: 5px; }
        .btn-delete { background: red; color: white; padding: 8px 12px; border: none; cursor: pointer; }
        .cart-summary { 
            background: #f5f5f5; 
            border: 2px solid #2c5f2d; 
            padding: 20px; 
            margin-top: 30px; 
            text-align: right;
        }
        .total-price { font-size: 24px; font-weight: bold; color: #2c5f2d; margin: 15px 0; }
        .btn-purchase { 
            background: #2c5f2d; 
            color: white; 
            padding: 12px 30px; 
            font-size: 16px; 
            border: none; 
            cursor: pointer; 
            margin-top: 15px;
        }
        .empty-cart { text-align: center; padding: 40px; }
    </style>
    <a href="index.html">| Home |</a>
    <a href="Asortiment.html">| Assortiment |</a>
    <a href="contact.html">| Contact |</a>
    <a href="winkelwagen.html">| Winkelwagen |</a>
</head>
<body>
    <header>
        <img id="logo" src="images/Nora'sFloraLogo.webp" alt="Nora's Flora" width="200" height="80">
        <nav class="div-options" role="navigation">
            <a href="index.html">| Home |</a>
            <a href="Asortiment.html">| Assortiment |</a>
            <a href="contact.html">| Contact |</a>
        </nav>
    </header>

    <main>
        <div class="cart-container">
            <h1>Winkelwagen</h1>
            <div id="cartItems"></div>
            <div class="cart-summary">
                <h3>Totaal: <span id="totalPrice">€0.00</span></h3>
                <button class="btn-purchase" onclick="purchaseClicked()">Kopen</button>
            </div>
        </div>
    </main>

    <footer id="footer">
        <div class="footer-text">
            <p>Email</p>
            <p>Telefoon</p>
            <p>Adres</p>
        </div>
        <div class="footer-text">
            <p>: contact@noraflora.com</p>
            <p>: 06 12345678</p>
            <p>: Zwolle, Pannenkoekendijk 420 B</p>
        </div>
        <div class="footer-text">
            <p id="openingstijden">Openingstijden</p>
            <p>Ma - Vr : 12:00 - 17:00</p>
            <p>Zaterdag : 10:00 - 17:00</p>
        </div>
    </footer>

    <script src="bloemen.js"></script>
    <script src="winkelwagen.js"></script>
</body>
</html>
